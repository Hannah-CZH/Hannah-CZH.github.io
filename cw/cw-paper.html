<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D建模与渲染</title>
  <link rel="icon" href="/img/zhihan.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/zhihan.png">
  <link rel="stylesheet" href="/css/grid.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <script defer src="/js/gallery.js"></script>
</head>

<body>

<!-- ================= NAV ================= -->
<nav>
  <div class="container">
    <div class="row">
      <div class="col-2 logo"><a href="/">Back</a></div>
      <div class="col-6"></div>
      <div class="col-4">
        <ul>
          <li>课内 / Coursework</li>
        </ul>
      </div>
      <div class="col-1"></div>
    </div>
  </div>
</nav>

<!-- ======================= PROJECT DETAIL ======================= -->
<section class="project-detail">

  <div class="container">
    <div class="row">
      <div class="col-2"></div>

      <div class="col-8">

        <!-- 标题部分 -->
        <div class="project-title-block">
          <h1 class="project-title-en">3D建模与渲染</h1>
          <h3 class="project-title-cn">浙大文创纸模设计</h3>
          <p class="project-subtitle">课程：计算机辅助工业设计</p>
        </div>

        <!-- 图片集（16:9 框 + 缩略图） -->
        <div class="project-gallery" data-current="0">
          <div class="gallery-main">
            <div class="gallery-main-inner">
              <!-- 主图：JS 会根据缩略图 data-full 切换 -->
              <img class="gallery-main-image" src="/img/coursework/paper/1.jpg" alt="浙大文创纸模设计">
            </div>
            <button class="gallery-arrow gallery-arrow-left" aria-label="上一张">&#10094;</button>
            <button class="gallery-arrow gallery-arrow-right" aria-label="下一张">&#10095;</button>
          </div>

          <div class="gallery-thumbs" role="tablist" aria-label="图片缩略图">
            <button class="gallery-thumb is-active" data-index="0" data-full="/img/coursework/paper/1.jpg" title="浙大文创纸模设计">
              <img src="/img/coursework/paper/1.jpg" alt="浙大文创纸模设计缩略图">
            </button>

            <button class="gallery-thumb" data-index="1" data-full="/img/coursework/paper/2.jpg" title="浙大文创纸模设计">
              <img src="/img/coursework/paper/2.jpg" alt="浙大文创纸模设计缩略图">
            </button>

            <button class="gallery-thumb" data-index="2" data-full="/img/coursework/paper/3.PNG" title="浙大文创纸模设计">
              <img src="/img/coursework/paper/3.PNG" alt="浙大文创纸模设计缩略图">
            </button>
            <button class="gallery-thumb" data-index="3" data-full="/img/coursework/paper/4.png" title="浙大文创纸模设计">
              <img src="/img/coursework/paper/4.png" alt="浙大文创纸模设计缩略图">
            </button>
            <button class="gallery-thumb" data-index="4" data-full="/img/coursework/paper/7.JPG" title="浙大文创纸模设计">
              <img src="/img/coursework/paper/7.JPG" alt="浙大文创纸模设计缩略图">
            </button>
          </div>
        </div>

      </div>

      <div class="col-2"></div>
    </div>
  </div>

</section>

</body>
</html>
