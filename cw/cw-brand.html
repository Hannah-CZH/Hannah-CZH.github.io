<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>东一线业品牌焕新方案</title>
  <link rel="icon" href="/img/zhihan.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/zhihan.png">
  <link rel="stylesheet" href="/css/grid.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <script defer src="/js/gallery.js"></script>
</head>

<body>

<!-- ================= NAV ================= -->
<nav>
  <div class="container">
    <div class="row">
      <div class="col-2 logo"><a href="/">Back</a></div>
      <div class="col-6"></div>
      <div class="col-4">
        <ul>
          <li>课内 / Coursework</li>
        </ul>
      </div>
      <div class="col-1"></div>
    </div>
  </div>
</nav>

<!-- ======================= PROJECT DETAIL ======================= -->
<section class="project-detail">

  <div class="container">
    <div class="row">
      <div class="col-2"></div>

      <div class="col-8">

        <!-- 标题部分 -->
        <div class="project-title-block">
          <h1 class="project-title-en">东一线业品牌焕新方案</h1>
          <h3 class="project-title-cn">色彩科技·可持续创新·智能共创</h3>
          <p class="project-subtitle">课程：品牌设计与全案管理</p>
        </div>

        <!-- 图片集（16:9 框 + 缩略图） -->
        <div class="project-gallery" data-current="0">
          <div class="gallery-main">
            <div class="gallery-main-inner">
              <!-- 主图：JS 会根据缩略图 data-full 切换 -->
              <img class="gallery-main-image" src="/img/coursework/brand/1.png" alt="封面">
            </div>
            <button class="gallery-arrow gallery-arrow-left" aria-label="上一张">&#10094;</button>
            <button class="gallery-arrow gallery-arrow-right" aria-label="下一张">&#10095;</button>
          </div>

          <div class="gallery-thumbs" role="tablist" aria-label="图片缩略图">
            <button class="gallery-thumb is-active" data-index="0" data-full="/img/coursework/brand/1.png" title="项目封面">
              <img src="/img/coursework/brand/1.png" alt="项目封面缩略图">
            </button>

            <button class="gallery-thumb" data-index="1" data-full="/img/coursework/brand/2.png" title="品牌故事板">
              <img src="/img/coursework/brand/2.png" alt="品牌故事板缩略图">
            </button>

            <button class="gallery-thumb" data-index="2" data-full="/img/coursework/brand/3.png" title="品牌价值">
              <img src="/img/coursework/brand/3.png" alt="品牌价值缩略图">
            </button>
            <button class="gallery-thumb" data-index="3" data-full="/img/coursework/brand/4.png" title="色彩系统">
              <img src="/img/coursework/brand/4.png" alt="色彩系统缩略图">
            </button>
            <button class="gallery-thumb" data-index="4" data-full="/img/coursework/brand/5.png" title="Logo系统">
              <img src="/img/coursework/brand/5.png" alt="Logo系统缩略图">
            </button>
            <button class="gallery-thumb" data-index="5" data-full="/img/coursework/brand/6.png" title="字体系统">
              <img src="/img/coursework/brand/6.png" alt="字体系统缩略图">
            </button>
            <button class="gallery-thumb" data-index="6" data-full="/img/coursework/brand/7.png" title="网页升级">
              <img src="/img/coursework/brand/7.png" alt="网页升级缩略图">
            </button>
            <button class="gallery-thumb" data-index="7" data-full="/img/coursework/brand/8.png" title="网页升级">
              <img src="/img/coursework/brand/8.png" alt="网页升级缩略图">
            </button>
            <button class="gallery-thumb" data-index="8" data-full="/img/coursework/brand/9.png" title="园区焕新">
              <img src="/img/coursework/brand/9.png" alt="园区焕新缩略图">
            </button>
            <button class="gallery-thumb" data-index="9" data-full="/img/coursework/brand/10.png" title="传播方案">
              <img src="/img/coursework/brand/10.png" alt="传播方案缩略图">
            </button>
          
          </div>
        </div>

      </div>

      <div class="col-2"></div>
    </div>
  </div>
<!-- ================= FOOTER ================= -->
<footer class="footer">
  <div class="container">
    <div class="row">
      <div class="col-2"></div>
      <div class="col-8">
        <div class="footer-line"></div>
        <div class="footer-text">
          Copyright © 曹之菡 / Cao Zhihan, Zhejiang University, All rights reserved.
        </div>
      </div>
      <div class="col-2"></div>
    </div>
  </div>
</footer>
</section>

</body>
</html>
